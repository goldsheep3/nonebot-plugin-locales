bind:
  help: |-
    Объединяет ваши привязки на нескольких платформах.
    Формат команды: /bind
    Бот сгенерирует команду привязки (/bind {token}); в течение срока действия отправьте эту команду боту на целевой платформе, чтобы завершить привязку.
  token_created: "Токен привязки создан: /bind {token}\nОтправьте эту команду боту на целевой платформе, чтобы завершить привязку. Токен истечёт через {ttl_minutes} мин."
  token_create_failed: "Не удалось создать токен привязки. Возможно, выполняется другая операция выпуска; попробуйте ещё раз."
  token_invalid: "Токен привязки недействителен или истёк."
  platform_conflict: "Целевой AID уже привязан к идентичности платформы {platform}; сначала отвяжите её и попробуйте снова."
  success: "Привязка завершена; текущая идентичность платформы привязана к AID {aid}."
  already_bound: "Текущая идентичность платформы уже привязана к AID {aid}."
unbind:
  restored: "Отвязка завершена; текущая идентичность платформы восстановлена до исходного AID {aid}."
  platform_restored: "Отвязка завершена; идентичность платформы {platform} восстановлена до исходного AID {aid}."
  platform_not_bound: "Текущий AID не привязан к идентичности платформы {platform}."
  platform_already_origin: "Идентичность платформы {platform} не привязана к другому AID; текущий AID — {aid}."
  already_origin: "Текущая идентичность платформы не привязана к другому AID.\nТекущие привязки AID {aid}: {bindings}"
language:
  help: |-
    Устанавливает текущий язык.
    Формат команды: /language {language}
    Доступные языки: {available}
  current: "Текущий язык: {language}"
  unsupported: "Язык {language} не поддерживается. Доступные языки: {available}"
  updated: "Язык установлен на {language}."
