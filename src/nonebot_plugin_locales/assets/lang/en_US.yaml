common:
  invalid_identity: "Invalid argument format. Use platform:user_id."
bind:
  help: |-
    Link your multi-platform accounts together.
    Command format: /bind
    The bot will generate a linking command (/bind {token}), which you need to send to the bot on the target platform within the validity period to complete the link.
  token_created: "Binding token generated: /bind {token}\nSend this command to the bot on the target platform to complete binding. The token expires in {ttl_minutes} minutes."
  token_invalid: "The binding token is invalid or expired."
  success: "Binding completed. This platform identity is now bound to AID {aid}."
  already_bound: "This platform identity is already bound to AID {aid}."
unbind:
  restored: "Unbound. This platform identity has been restored to its initial AID {aid}."
  target_restored: "Unbound. {target} has been restored to its initial AID {aid}."
  already_origin: "This platform identity is not bound to another AID.\nBindings of current AID {aid}: {bindings}"
  target_already_origin: "{target} is not bound to another AID. Current AID is {aid}."
language:
  help: |-
    Set the current language.
    Command format: /language {language}
    Available languages: {available}
  current: "Current language: {language}"
  unsupported: "Unsupported language {language}. Available languages: {available}"
  updated: "Language has been set to {language}."
